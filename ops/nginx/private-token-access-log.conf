# Include in http {}. No location blocks: existing proxy routing is unchanged.
# Log normalized URI only (no query strings), never $request/$request_uri/$http_referer.
map $uri $ener_safe_log_uri {
    default $uri;
    ~*^/myscans/ /myscans/[redacted];
    ~*^/r/ /r/[redacted];
    ~*^/api/public-report/ /api/public-report/[redacted];
}
log_format ener_private '$remote_addr - $remote_user [$time_local] '
    '"$request_method $ener_safe_log_uri $server_protocol" $status $body_bytes_sent';
# In the EXISTING target server, replace its access_log format with:
# access_log /var/log/nginx/access.log ener_private;
# Audit inherited/other access_log directives too. Do not add a new location.
