# Disposable container only. Verifies logging without changing location routing.
events {}
http {
    include /etc/nginx/private-token-access-log.conf;
    access_log /tmp/ener-private-access.log ener_private;
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location / { return 200 'upstream-route-unchanged'; }
    }
    server {
        listen 127.0.0.1:8080;
        location / { proxy_pass http://127.0.0.1:8081; }
    }
}
